<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>War in the Midst of Peace</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- ========================= -->
    <!-- MAIN INTRO SCREEN -->
    <!-- ========================= -->

    <div id="intro">

        <h1>
            War in the Midst of Peace
        </h1>

        <button id="startBtn">
            Click Me for a Surprise
        </button>

    </div>


    <!-- ========================= -->
    <!-- INTRO VIDEO -->
    <!-- ========================= -->

    <div id="videoSection">

        <video id="introVideo" autoplay playsinline>

            <source src="introo.mp4" type="video/mp4">

            Your browser does not support video.

        </video>

        <div id="overlay"></div>


        <!-- Skip Intro -->

        <button id="skipBtn">
            Skip Intro
        </button>


        <!-- Continue Reading -->

        <button id="continueBtn">
            Continue Reading
        </button>

    </div>


    <!-- ========================= -->
    <!-- STORY -->
    <!-- ========================= -->

    <div id="story">


        <!-- Chapter Title -->

        <div id="chapterTitle">

            <h1 id="chapterNumber">
                Chapter 1
            </h1>

            <h2 id="chapterName">
                A well-known tech
            </h2>

        </div>

         <div id="chapterTitle">

            <h1 id="chapterNumber">
                Chapter 2
            </h1>

            <h2 id="chapterName">
                Blank
            </h2>

        </div>

         <div id="chapterTitle">

            <h1 id="chapterNumber">
                Chapter 3
            </h1>

            <h2 id="chapterName">
                Crossing Paths with You
            </h2>

        </div>

         <div id="chapterTitle">

            <h1 id="chapterNumber">
                Chapter 1
            </h1>

            <h2 id="chapterName">
                For The Girl Who Kept Dropping Her Guard
            </h2>

        </div>





        <!-- Panels -->

        <div id="panels"></div>


        <!-- Chapter Navigation -->

        <div id="chapterNavigation">

            <button id="previousChapter">
                ← Previous Chapter
            </button>

            <button id="nextChapter">
                Next Chapter →
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
