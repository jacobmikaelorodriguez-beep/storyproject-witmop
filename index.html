<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WITMOP</title>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <!-- Opening Screen -->
  
  <div id="intro">
    
    <h1>War in the Midst of Peace</h1>
    
    <button id="startBtn">
      Click Me for a Surprise
    </button>
    
  </div>
  
  <!-- Intro Video -->
  
  <div id="videoSection">
    
    <video id="introVideo" playsinline>
      <source src="Video/intro.mp4" type="video/mp4">
    </video>
    
    <div id="overlay"></div>
    
    <button id="continueBtn">
      Continue Reading
    </button>
    
  </div>
  
  <!-- Story -->
  
  <div id="story">
    
    <img src="panel1.jpg" class="panel">
    <img src="panel2.jpg" class="panel">
    <img src="panel3.jpg" class="panel">
    <img src="panel4.jpg" class="panel">
    
  </div>
  
  <script src="script.js"></script>
  
</body>

</html>
